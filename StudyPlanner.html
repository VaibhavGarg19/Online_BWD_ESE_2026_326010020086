<!DOCTYPE html>
<html lang="en">
<head>
  <title>Study Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="planner">
    <header class="page-header">
      <p class="eyebrow">MY STUDY SPACE</p>
      <h1>Study Planner</h1>
      <p class="intro">Make a plan, take one step at a time, and celebrate your progress.</p>
    </header>

    <nav class="site-nav" aria-label="Main navigation">
      <a class="nav-link active" href="StudyPlanner.html" aria-current="page">Dashboard</a>
      <a class="nav-link" href="subjects.html">Subjects</a>
      <a class="nav-link" href="timetable.html">Weekly Timetable</a>
      <a class="nav-link" href="study-tips.html">Study Tips</a>
    </nav>

    <section class="summary" aria-label="Study progress">
      <div class="summary-card">
        <span class="summary-label">Total tasks</span>
        <strong id="total-count">0</strong>
      </div>
      <div class="summary-card">
        <span class="summary-label">Completed</span>
        <strong id="completed-count">0</strong>
      </div>
      <div class="summary-card">
        <span class="summary-label">Still to do</span>
        <strong id="remaining-count">0</strong>
      </div>
    </section>

    <section class="panel add-panel">
      <h2>Add a study task</h2>
      <form id="task-form">
        <div class="form-fields">
          <label>
            Task
            <input id="task-title" type="text" placeholder="For example, revise chapter 2" required>
          </label>
          <label>
            Subject
            <select id="task-subject" required>
              <option value="" disabled selected>Select a subject</option>
              <option>Entrepreneurship</option>
              <option>Mathematics - 1</option>
              <option>Architectural Organization Of Computers</option>
              <option>Programming Practices – 1 (Basics Of C)</option>
              <option>Basics Of Web Development</option>
              <option>Environmental Science</option>
            </select>
          </label>
          <label>
            Due date
            <input id="task-date" type="date" required>
          </label>
        </div>
        <button class="add-button" type="submit">+ Add task</button>
      </form>
    </section>

    <section class="panel tasks-panel">
      <div class="tasks-heading">
        <div>
          <h2>Your tasks</h2>
          <p>Keep track of what you need to study.</p>
        </div>
        <div class="filters" aria-label="Filter tasks">
          <button class="filter-button active" type="button" data-filter="all">All</button>
          <button class="filter-button" type="button" data-filter="active">To do</button>
          <button class="filter-button" type="button" data-filter="completed">Done</button>
        </div>
      </div>
      <ul id="task-list" class="task-list" aria-live="polite"></ul>
    </section>

    <footer>Small steps add up. You’ve got this!</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
